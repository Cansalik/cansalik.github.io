<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">

<title>Okul Öncesi Eğitim – İndir</title>

<style>
  :root{--bg:#FFDC26;--ink:#1f2a1f;--card:#ffffff}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:linear-gradient(#FFE24A,#FFC21A);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px 16px}
  main{width:100%;max-width:420px;text-align:center}
  .icon{width:132px;height:132px;border-radius:30px;box-shadow:0 10px 30px rgba(120,60,0,.25)}
  h1{font-size:28px;margin:18px 0 6px;color:#D7262E}
  p{margin:0 0 22px;font-size:16px;line-height:1.45}
  .free{display:inline-block;background:#D7262E;color:#fff;font-weight:700;padding:6px 16px;border-radius:999px;margin-bottom:22px}
  a.btn{display:flex;align-items:center;justify-content:center;gap:12px;background:#111;color:#fff;text-decoration:none;border-radius:16px;padding:14px 18px;margin:0 0 12px;font-size:18px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.18)}
  a.btn small{display:block;font-size:12px;font-weight:400;opacity:.8;text-align:left}
  a.btn span{text-align:left;line-height:1.15}
  a.btn svg{width:28px;height:28px;flex:none}
  footer{margin-top:22px;font-size:13px;opacity:.75}
  footer a{color:inherit}
</style>
</head>
<body>
<main>
  <img class="icon" src="icon.png" alt="Okul Öncesi Eğitim simgesi">
  <h1>Okul Öncesi Eğitim</h1>
  <p>Harfler, sayılar, hayvanlar, meyveler, araçlar ve renkler — sesli kartlar ve eğitici oyunlarla.</p>
  <div class="free">ÜCRETSİZ</div>

  <a class="btn" id="ios" href="https://apps.apple.com/app/id6823739656">
    <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.4-.8s2 .8 3.4.8c1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9 0 0-2.8-1.1-2.8-4.1zM13.9 4.9c.7-.9 1.2-2.1 1.1-3.3-1 0-2.3.7-3 1.6-.7.8-1.3 2-1.1 3.2 1.1.1 2.3-.6 3-1.5z"/></svg>

    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#34A853" d="M3.6 1.8 13.4 12l-9.8 10.2c-.4-.2-.6-.7-.6-1.2V3c0-.5.2-1 .6-1.2z"/><path fill="#FBBC04" d="m16.8 8.6-3.4 3.4 3.4 3.4 3.9-2.2c.8-.5.8-1.7 0-2.2z"/><path fill="#4285F4" d="M3.6 1.8c.3-.2.8-.2 1.2 0l12 6.8-3.4 3.4z"/><path fill="#EA4335" d="M13.4 12l3.4 3.4-12 6.8c-.4.2-.9.2-1.2 0z"/></svg>

</main>
<script>
  // Telefona göre doğru mağazaya otomatik yönlendirme (?kal eklenirse yönlendirmez)
  (function(){
    if (location.search.indexOf('kal') !== -1) return;
    var ua = navigator.userAgent || '';
    var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/i.test(ua);
    var target = isIOS ? document.getElementById('ios').href : (isAndroid ? document.getElementById('android').href : null);
    if (target) setTimeout(function(){ location.replace(target); }, 300);
  })();
</script>

</html>
